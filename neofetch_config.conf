# Minimal clean neofetch config (English)

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Shell" shell
    info "Resolution" resolution

    info "CPU" cpu
    info "Memory" memory

    info "Terminal" term
}

# ASCII logo
ascii_distro="mac"
ascii_bold="off"

# Clean, soft color palette
colors=(4 7 1 3 2 6)

# Text style
bold="off"

# Memory display
memory_percent="on"

# Reduce noise
package_managers="off"

# Disable extras
cpu_temp="off"
gpu_temp="off"
refresh_rate="off"
